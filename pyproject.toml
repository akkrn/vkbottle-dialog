[project]
name = "vkbottle-dialog"
version = "0.1.0"
description = "Declarative dialogs for VK bots on top of vkbottle (aiogram-dialog port)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["vkbottle>=4.5", "magic-filter>=1.0"]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "fakeredis>=2.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vkbottle_dialog"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
